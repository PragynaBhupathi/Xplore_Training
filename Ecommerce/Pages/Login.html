<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Think Mart</title>
    <link rel="icon" href="https://static.vecteezy.com/system/resources/thumbnails/075/744/712/small_2x/mart-shopping-cart-logo-with-price-tag-and-shopping-trolley-icon-combination-white-icon-on-purple-background-retail-store-branding-online-shopping-business-logo-vector.jpg">
    <link rel="stylesheet" href="../style/auth.css">
</head>
<body>
    <div class="auth-box">
        <img src="https://static.vecteezy.com/system/resources/thumbnails/075/744/712/small_2x/mart-shopping-cart-logo-with-price-tag-and-shopping-trolley-icon-combination-white-icon-on-purple-background-retail-store-branding-online-shopping-business-logo-vector.jpg" alt="Think Mart logo">
        <h2>Welcome Back</h2>
        <p class="sub">Login to continue shopping</p>
        <form action="./index.html" method="get">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
            <button type="submit">Login</button>
        </form>
        <p class="switch">New here? <a href="./Register.html">Create an account</a></p>
    </div>
</body>
</html>
